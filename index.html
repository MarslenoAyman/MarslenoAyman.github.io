<style>
/* Layout: a phone shaped card. The photo fills the top and melts into the shirt navy; glass controls sit below.
   All sizes are in cqi (1cqi = 1% of the card width), so the card keeps one set of proportions on every screen.
   One spacing rhythm at a 420px card: s1 4px, s2 8px, s3 16px, s4 24px, s5 32px.
   Palette sampled from the photo: shirt navy #2b2e3d, studio wall grey #898c93. */
:root {
  --page: #0b0d13;
  --page-glow: #1d2030;
  --navy: #2b2e3d;        /* exact shirt colour: the photo melts into it */
  --deep: #161924;        /* bottom of the card */
  --ivory: #f2f1ed;       /* name and the main button */
  --silver: #c5cbd7;      /* role line */
  --wall: #b3b7c1;        /* studio wall grey, lifted for text */
  --soft: #858a96;        /* footer */
  --edge: rgba(255,255,255,.16);
  --edge-hi: rgba(255,255,255,.34);
  --glass: rgba(255,255,255,.055);
  --glass-hi: rgba(255,255,255,.12);
  --s1: .95cqi; --s2: 1.9cqi; --s3: 3.8cqi; --s4: 5.7cqi; --s5: 7.6cqi;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Jost", "Futura", "Century Gothic", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--page); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(90% 55% at 50% 0%, var(--page-glow) 0%, transparent 70%) fixed,
    radial-gradient(70% 45% at 50% 100%, #12141d 0%, transparent 70%) fixed,
    var(--page);
  color: var(--ivory);
  font-family: var(--body);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-block: clamp(16px, 4vh, 48px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- card ---------- */
.card {
  container-type: inline-size;
  position: relative;
  width: 100%;
  max-width: 420px;
  max-width: clamp(300px, calc((100svh - 64px) / 1.88), 480px);
  border-radius: 32px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(to bottom, var(--navy) 0%, var(--navy) 48%, var(--deep) 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.07),
    0 2px 6px rgba(0,0,0,.25),
    0 50px 100px -30px rgba(0,0,0,.75);
  animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
}
.card::after {
  /* a hairline of light on the top edge, like glass */
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.09);
}

/* ---------- photo and name ---------- */
.hero { position: relative; width: 100%; aspect-ratio: 1 / 1.08; }
.hero img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 0%;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 60%, rgba(0,0,0,.55) 80%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 0%, #000 60%, rgba(0,0,0,.55) 80%, transparent 100%);
}
.hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 40%;
  background: linear-gradient(to bottom, rgba(43,46,61,0), rgba(43,46,61,.9));
}
.hero .name {
  position: absolute;
  z-index: 1;
  left: 0; right: 0; bottom: var(--s1);
  display: grid;
  justify-items: center;
  gap: var(--s2);
  text-align: center;
  padding-inline: var(--s4);
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 7.1cqi;
  line-height: 1.05;
  letter-spacing: .13em;
  padding-left: .13em;
  white-space: nowrap;
  text-transform: uppercase;
  text-shadow: 0 2px 22px rgba(0,0,0,.4);
}
.role {
  display: flex;
  align-items: center;
  gap: var(--s3);
  font-size: max(10.5px, 3cqi);
  font-weight: 400;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: var(--silver);
}
.role::before, .role::after {
  content: "";
  width: var(--s4);
  height: 1px;
  background: currentColor;
  opacity: .5;
}
.role span { padding-left: .34em; }

/* ---------- body ---------- */
.body {
  display: grid;
  justify-items: center;
  padding: var(--s3) var(--s4) var(--s4);
}
.pipeline {
  margin: 0;
  font-size: max(12.5px, 3.6cqi);
  line-height: 1.5;
  color: var(--wall);
  text-align: center;
  text-wrap: balance;
}

.icons { display: flex; gap: var(--s3); margin-top: var(--s4); }
.icon {
  width: max(42px, 11cqi);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--edge);
  background: var(--glass);
  color: var(--ivory);
  transition: background-color .25s ease, border-color .25s ease, color .25s ease, transform .25s ease;
}
.icon svg { width: 40%; fill: currentColor; }
.icon:hover { background: var(--ivory); border-color: var(--ivory); color: #1b1e2a; transform: translateY(-2px); }

.links { width: 100%; display: grid; gap: var(--s3); margin-top: var(--s5); }
.btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: max(52px, 13.6cqi);
  padding: 0 calc(var(--s5) + var(--s4));
  border-radius: max(14px, 3.8cqi);
  border: 1px solid var(--edge);
  background: var(--glass);
  color: var(--ivory);
  text-decoration: none;
  font-size: max(11.5px, 3.25cqi);
  font-weight: 400;
  letter-spacing: .2em;
  text-transform: uppercase;
  text-align: center;
  transition: background-color .25s ease, border-color .25s ease, transform .25s ease, box-shadow .25s ease;
}
.btn .lead, .btn .go {
  position: absolute;
  top: 50%;
  translate: 0 -50%;
  display: grid;
  place-items: center;
}
.btn .lead { left: var(--s4); }
.btn .go { right: var(--s4); opacity: .55; transition: opacity .25s ease, translate .25s ease; }
.btn svg { width: max(15px, 4cqi); height: auto; fill: currentColor; }
.btn .go svg { width: max(12px, 3.2cqi); }
.btn:hover { background: var(--glass-hi); border-color: var(--edge-hi); transform: translateY(-1px); }
.btn:hover .go { opacity: 1; translate: 3px -50%; }
.btn.solid {
  background: var(--ivory);
  border-color: var(--ivory);
  color: #1b1e2a;
  font-weight: 500;
  box-shadow: 0 10px 30px -12px rgba(242,241,237,.35);
}
.btn.solid:hover { background: #ffffff; box-shadow: 0 14px 34px -12px rgba(242,241,237,.45); }
.btn:focus-visible, .icon:focus-visible { outline: 2px solid var(--ivory); outline-offset: 3px; }

.foot {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-top: var(--s5);
  font-size: max(10px, 2.6cqi);
  letter-spacing: .34em;
  text-transform: uppercase;
  color: var(--soft);
}
.foot svg { width: max(11px, 2.9cqi); fill: currentColor; }

/* narrow cards (small phones): keep every label on one line */
.role, .btn { white-space: nowrap; }
@container (max-width: 340px) {
  .role { gap: var(--s2); letter-spacing: .26em; }
  .role::before, .role::after { width: var(--s3); }
  .btn { letter-spacing: .12em; padding: 0 calc(var(--s4) + var(--s4)); }
  .btn .lead { left: var(--s3); } .btn .go { right: var(--s3); }
}

@container (max-width: 280px) {
  .btn { letter-spacing: .06em; padding: 0 36px; }
  .btn .go { display: none; }
}

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

@supports not (width: 1cqi) {
  :root { --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 32px; }
  h1 { font-size: 30px; } .role { font-size: 12.5px; } .pipeline { font-size: 15px; }
  .icon { width: 46px; } .btn { min-height: 57px; font-size: 13.5px; border-radius: 16px; }
  .btn svg { width: 17px; } .btn .go svg { width: 13px; } .foot { font-size: 11px; } .foot svg { width: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .btn, .icon, .btn .go { transition: none; }
}
</style>
